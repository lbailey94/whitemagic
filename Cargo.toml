[workspace]
resolver = "2"
members = ["crates/wm-gen3-core", "crates/wm-gen3-harness", "crates/wm-gen3-systemone", "crates/wm-gen3-zeropointfive"]

[workspace.package]
version = "10.2.0-alpha"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["WhiteMagic Project"]

[workspace.dependencies]
wm-gen3-core = { path = "crates/wm-gen3-core", version = "10.2.0-alpha" }
wm-gen3-systemone = { path = "crates/wm-gen3-systemone", version = "10.2.0-alpha" }
wm-gen3-zeropointfive = { path = "crates/wm-gen3-zeropointfive", version = "10.2.0-alpha" }

[workspace.lints.rust]
unsafe_code = "forbid"
