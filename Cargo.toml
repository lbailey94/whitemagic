[workspace]
resolver = "2"
members = [
    "crates/wm-gen3-core",
    "crates/wm-gen3-harness",
    "crates/wm-gen3-shm",
    "crates/wm-gen3-systemone",
    "crates/wm-gen3-vault",
    "crates/wm-gen3-zeropointfive",
    "crates/wm-sandbox",
]

[workspace.package]
version = "11.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["WhiteMagic Project"]

[workspace.dependencies]
wm-gen3-core = { path = "crates/wm-gen3-core", version = "11.2.0" }
wm-gen3-shm = { path = "crates/wm-gen3-shm", version = "11.2.0" }
wm-gen3-systemone = { path = "crates/wm-gen3-systemone", version = "11.2.0" }
wm-gen3-vault = { path = "crates/wm-gen3-vault", version = "11.2.0" }
wm-gen3-zeropointfive = { path = "crates/wm-gen3-zeropointfive", version = "11.2.0" }
wm-sandbox = { path = "crates/wm-sandbox", version = "11.2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep Candle 0.9 APIs while resolving its ZIP dependency to the patched release.
# Provenance and the one-line manifest patch are documented in vendor/candle-core/PATCH.md.
[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
