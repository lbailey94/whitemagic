# Build configuration for WhiteMagic v4
# mold linker + sccache for maximum build speed.

[build]
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    # Native CPU optimizations for release/bench — enables AVX2 SIMD on Skylake+.
    # Safely ignored for debug builds (just produces native-specific code).
    "-C", "target-cpu=native",
]
