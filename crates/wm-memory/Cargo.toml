[package]
name = "wm-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
wm-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ahash = { workspace = true }
tracing = { workspace = true }
lmdb = "0.8"
lmdb-sys = "0.8"
tantivy = "0.26"
rayon = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
ureq = { workspace = true }

# Optional ONNX Runtime local embedder (fastembed-rs)
fastembed = { version = "5", optional = true }

# Optional LanceDB vector search backend
lancedb = { version = "0.33", optional = true }
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
arrow = { version = "58", optional = true }
futures = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }

[features]
lancedb = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:arrow", "dep:futures", "dep:tokio"]
onnx = ["dep:fastembed"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "store_bench"
harness = false

[[bench]]
name = "embedder_bench"
harness = false
