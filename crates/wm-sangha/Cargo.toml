[package]
name = "wm-sangha"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Federated collective-memory transport (Sangha) for WhiteMagic instances."
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "memory", "ai-agents", "local-first"]


[dependencies]
wm-core = { workspace = true }
wm-governance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# Optional network transport (TCP + UDP)
tokio = { workspace = true, optional = true, features = ["net", "sync"] }
socket2 = { workspace = true, optional = true }
ed25519-dalek = "3.0.0"

[features]
default = ["transport"]
transport = ["dep:tokio", "dep:socket2"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
