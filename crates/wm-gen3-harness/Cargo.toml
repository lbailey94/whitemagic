[package]
name = "wm-gen3-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WhiteMagic Gen3 — stdio JSON-RPC adapter (plumbing only; experiment harness)"

[lib]
name = "wm_gen3_harness"
path = "src/lib.rs"

[[bin]]
name = "wm-gen3"
path = "src/main.rs"

[[bin]]
name = "wm"
path = "src/bin/wm.rs"

[[bin]]
name = "wm_benchmark"
path = "src/bin/wm_benchmark.rs"

[[bin]]
name = "wm-node"
path = "src/bin/wm_node.rs"

[features]
default = ["system05"]
systemone = ["dep:wm-gen3-systemone"]
system05 = []
system05-onig = ["system05", "wm-gen3-zeropointfive/onig"]

[dependencies]
wm-gen3-core = { workspace = true, features = ["operator"] }
wm-gen3-shm = { workspace = true }
wm-gen3-vault = { workspace = true }
wm-gen3-zeropointfive = { workspace = true }
wm-gen3-systemone = { workspace = true, optional = true }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
ed25519-dalek = "3.0.0"
signal-hook = "0.3"

[lints]
workspace = true
