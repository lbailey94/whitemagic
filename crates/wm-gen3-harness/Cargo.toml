[package]
name = "wm-gen3-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WhiteMagic Gen3 — stdio JSON-RPC adapter (plumbing only; experiment harness)"

[lib]
name = "wm_gen3_harness"
path = "src/lib.rs"

[[bin]]
name = "wm-gen3"
path = "src/main.rs"

[[bin]]
name = "wm"
path = "src/bin/wm.rs"

[features]
systemone = ["dep:wm-gen3-systemone"]

[dependencies]
wm-gen3-core = { path = "../wm-gen3-core", features = ["operator"] }
wm-gen3-systemone = { path = "../wm-gen3-systemone", optional = true }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[lints]
workspace = true
