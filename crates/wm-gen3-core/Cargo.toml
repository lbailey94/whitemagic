[package]
name = "wm-gen3-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WhiteMagic Gen3 — minimal substrate skeleton (Phase 1 first slice)"

[features]
# Operator-side construction paths (e.g. RatifiedChannel::mint). Never enabled by
# the adaptive layer; see docs/DEPENDENCY_MANIFEST.md.
operator = []
reference-models = []

[[test]]
name = "adversary_contract"
required-features = ["reference-models"]

[[test]]
name = "intake_public"
required-features = ["operator"]

[[test]]
name = "gate9a_sweep_acceptance"
required-features = ["operator"]

[[test]]
name = "gate9a_article9_acceptance"
required-features = ["operator"]

[[test]]
name = "gate9c_precision_acceptance"
required-features = ["operator"]

[[test]]
name = "gate9d_reality_battery"
required-features = ["operator", "reference-models"]

[[test]]
name = "gate10_p2p_mesh_acceptance"
required-features = ["operator"]

[[test]]
name = "gate10_cyberbrain_provenance_and_transfer_battery"
required-features = ["operator"]

[[test]]
name = "gate11_causal_graph_battery"
required-features = ["operator"]

[[test]]
name = "gate12_dream_cycle_compaction_battery"
required-features = ["operator"]

[[test]]
name = "gate13_cryptographic_identity_battery"
required-features = ["operator"]

[[test]]
name = "cyberbrain_baseline_benchmark"
required-features = ["operator"]

[dependencies]
fastembed = "5.17.4"
lmdb = "0.8"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# At-rest crypto hierarchy + record AEAD (Q39 slices A–B port from v9):
# Argon2id for passphrase-mode roots, XChaCha20-Poly1305 for keyring and
# record envelopes, HKDF-SHA256 for galaxy/scope derivation, zeroization
# for secret buffers. Versions mirror the v9 branch exactly.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
rayon = "1.10"
ed25519-dalek = "3.0.0"
getrandom = "0.3"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
wm-gen3-shm = { workspace = true }
memchr = "2.8"
regex = "1"

[target.'cfg(unix)'.dependencies]
rlimit = "0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
proptest = "1.11"

[lints]
workspace = true
