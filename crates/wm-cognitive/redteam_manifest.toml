# Redteam Manifest — declares attack surfaces for the dynamic redteam cycle.
#
# Each entry describes a crate, its attack surfaces, and whether tests exist.
# The redteam cycle reads this manifest and generates proposals for any
# attack surface that lacks test coverage.
#
# Updated by developers when new crates/features are added.

