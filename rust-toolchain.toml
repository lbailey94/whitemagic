# Toolchain pin — mirrors the WMv9 Q38 supply-chain pin (see WMv9 `rust-toolchain.toml`).
# 1.98.0 is the toolchain the nucleus freeze and the Phase-4 canaries were built with;
# pinning removes machine-default drift (rustfmt/clippy behavior included). Rebuilds at a
# later compiler version are recorded events with fresh canaries (NUCLEUS S7: pins are
# anchors, regenerated when a constituent changes).
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["x86_64-unknown-linux-gnu"]
