# Toolchain pin — Q38 supply-chain acceptance (pinned toolchain in release provenance).
# 1.98.0 = the toolchain the v9.1.3 release tree was verified against locally
# (fmt clean, clippy -D warnings clean across the workspace, full tests green).
# CI jobs use dtolnay/rust-toolchain, which reads this file automatically.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
