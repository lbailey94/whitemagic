name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wm-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: wm-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wm-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wm-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin wm

      - name: Smoke test curated workflow (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/curated_smoke_test.py --binary target/${{ matrix.target }}/release/wm

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/wm${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
