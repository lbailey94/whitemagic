name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wm-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: wm-linux-x86_64-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: wm-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wm-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wm-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools (static Linux build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Ensure target installed
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin wm

      - name: Smoke test curated workflow (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/curated_smoke_test.py --binary target/${{ matrix.target }}/release/wm

      - name: Rename binary for release (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          mv wm ${{ matrix.artifact }}

      - name: Generate checksum over distributed name (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Rename binary for release + checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Move-Item wm.exe ${{ matrix.artifact }}
          (Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}" | Out-File -Encoding ascii ${{ matrix.artifact }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.sha256
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOMs for the workspace
        run: cargo cyclonedx --all --format json
      - name: Collect SBOMs
        run: |
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './target/*' -exec cp {} sbom/ \;
          ls -la sbom/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (keyless, Sigstore)
        run: |
          for f in artifacts/wm-*; do
            case "$f" in *.sha256|*.bundle|*.cdx.json) continue ;; esac
            echo "signing $f"
            cosign sign-blob --yes "$f" --bundle "$f.bundle"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  registries:
    name: Publish registries
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crates.io (dependency order, 429-aware)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          CRATES="wm-core wm-conformal wm-substrate wm-selfmodel wm-simulation wm-workspace wm-polyglot wm-memory wm-governance wm-bicameral wm-sangha wm-dispatch wm-cognitive wm-tools whitemagic"
          for c in $CRATES; do
            done_pkg=""; lag=0
            while [ -z "$done_pkg" ]; do
              if cargo publish -p "$c" > /tmp/pub.log 2>&1; then
                echo "PUBLISHED: $c"; done_pkg=1; sleep 20
              elif grep -aq "already exists" /tmp/pub.log; then
                echo "SKIP (already live): $c"; done_pkg=1
              elif grep -aq "429 Too Many" /tmp/pub.log; then
                after=$(grep -aoP "try again after \K.*?GMT" /tmp/pub.log | head -n1)
                wait=$(( $(date -d "$after" +%s 2>/dev/null || echo 0) - $(date +%s) + 15 ))
                [ "$wait" -lt 15 ] && wait=300
                echo "rate-limited on $c - sleeping ${wait}s"; sleep "$wait"
              elif grep -aqE "no matching package|failed to select" /tmp/pub.log; then
                lag=$((lag+1)); [ "$lag" -gt 6 ] && { echo "FAILED (index lag): $c"; exit 1; }
                echo "index lag on $c - retry $lag"; sleep 30
              else
                echo "FAILED: $c"; tail -20 /tmp/pub.log; exit 1
              fi
            done
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/whitemagic-mcp
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "whitemagic-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "npm ${VERSION} already published - skipping"
          else
            npm publish --access public
          fi

      - name: Publish Docker Hub (skips without secrets)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then echo "DOCKERHUB_TOKEN not set - skipping"; exit 0; fi
          VERSION="${GITHUB_REF_NAME#v}"; MAJOR="${VERSION%%.*}"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build --build-arg "WM_VERSION=${GITHUB_REF_NAME}" \
            -t "lbailey94/whitemagic:${VERSION}" -t "lbailey94/whitemagic:${MAJOR}" -t lbailey94/whitemagic:latest .
          docker push "lbailey94/whitemagic:${VERSION}"
          docker push "lbailey94/whitemagic:${MAJOR}"
          docker push lbailey94/whitemagic:latest

      - name: Publish MCP registry (GitHub OIDC)
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz -C /tmp mcp-publisher
          cd npm/whitemagic-mcp
          /tmp/mcp-publisher login github-oidc
          set +e
          out=$(/tmp/mcp-publisher publish server.json 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "$out" | grep -qiE "already|exists|duplicate|conflict|409" && echo "already published - skipping" || exit 1
          fi
