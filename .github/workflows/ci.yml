name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    timeout-minutes: 10
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    timeout-minutes: 15
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  host-scripts:
    timeout-minutes: 10
    name: Host Scripts (installer, version truth, npm launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tests (installer sentinel, version truth, release manifest)
        run: python3 -m unittest scripts.tests.test_install_sh scripts.tests.test_version_truth scripts.tests.test_release_manifest
      - name: npm launcher tests
        working-directory: npm/whitemagic-mcp
        run: node --test

  test-linux:
    timeout-minutes: 20
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (capture counts)
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee /tmp/cargo-test.log
      - name: Write test counts (release facts)
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          log = pathlib.Path('/tmp/cargo-test.log')
          passed = failed = ignored = 0
          if log.is_file():
              for m in re.finditer(
                  r'test result: \w+\. (\d+) passed; (\d+) failed; (\d+) ignored',
                  log.read_text(),
              ):
                  passed += int(m.group(1)); failed += int(m.group(2)); ignored += int(m.group(3))
          pathlib.Path('tests.json').write_text(json.dumps({
              "passed": passed, "failed": failed, "ignored": ignored,
              "source": "CI Linux: cargo test --all-targets",
          }, indent=2) + "\n")
          print(f"passed={passed} failed={failed} ignored={ignored}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-summary
          path: tests.json
          if-no-files-found: warn

  smoke:
    timeout-minutes: 15
    name: Curated Smoke Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin wm
      - run: python3 scripts/curated_smoke_test.py

  smoke-aarch64:
    timeout-minutes: 30
    name: Curated Smoke Test (Linux aarch64 ${{ matrix.flavor }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gnu
            target: aarch64-unknown-linux-gnu
          - flavor: musl
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: matrix.flavor == 'musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} --bin wm
      - name: Selftest (native arm64)
        run: target/${{ matrix.target }}/release/wm selftest --json
      - run: python3 scripts/curated_smoke_test.py --binary target/${{ matrix.target }}/release/wm

  installer-windows:
    timeout-minutes: 25
    name: Windows Installer (install.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin wm
      - name: Generate checksum for local-file mode
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/wm.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  wm-windows-x86_64.exe" | Out-File -Encoding ascii target/release/wm-windows-x86_64.exe.sha256
      - name: Run install.ps1 (local-file mode)
        shell: pwsh
        run: |
          ./scripts/install.ps1 -File target/release/wm.exe `
            -ChecksumFile target/release/wm-windows-x86_64.exe.sha256 `
            -Dir "$env:RUNNER_TEMP\wm-bin" -Ref ci
      - name: Smoke test the installed binary
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\wm-bin\wm.exe" --version
          & "$env:RUNNER_TEMP\wm-bin\wm.exe" selftest --json | Out-Null
          Write-Host "install.ps1 smoke passed"
      - name: Tampered binary must be refused
        shell: pwsh
        run: |
          $tampered = "$env:RUNNER_TEMP\tampered.exe"
          Copy-Item target/release/wm.exe $tampered
          Add-Content -LiteralPath $tampered -Value "tamper" -Encoding ascii
          $proc = Start-Process pwsh -PassThru -Wait -ArgumentList @(
            "-NoProfile", "-File", "scripts/install.ps1",
            "-File", $tampered,
            "-ChecksumFile", "target/release/wm-windows-x86_64.exe.sha256",
            "-Dir", "$env:RUNNER_TEMP\wm-bin-bad"
          )
          if ($proc.ExitCode -eq 0) { Write-Error "tampered binary must be refused"; exit 1 }
          Write-Host "tampered binary refused (exit $($proc.ExitCode))"

  optional-features:
    timeout-minutes: 20
    name: Optional Feature Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "whitemagic/python"
          - "wm-memory/lancedb"
          - "wm-memory/onnx"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (required by lance-encoding)
        if: matrix.features == 'wm-memory/lancedb'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --features "${{ matrix.features }}"

  test-macos:
    timeout-minutes: 20
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  test-windows:
    # 45m was three consecutive timeouts (Sep 8-9); 90m leaves headroom for
    # a cold rust-cache rebuild on the Windows runner.
    timeout-minutes: 90
    name: Tests (Windows)
    runs-on: windows-latest
    env:
      # NTFS materializes each LMDB map file at full size on open; hundreds
      # of parallel test stores would exhaust the runner disk otherwise.
      WM_DEFAULT_MAP_SIZE: "33554432"
    steps:
      - name: Free disk space (LMDB 4GB test maps fail on a full runner disk)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # nextest + per-test hard timeout (.config/nextest.toml, profile ci):
      # a Windows-only hang costs 3 minutes per test and is reported by
      # name, instead of burning the job to the 90m ceiling.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@latest
      # --lib/--bins/--tests: benches excluded — nextest runs harness=false
      # criterion binaries in full benchmark mode (minutes per bench),
      # unlike plain cargo test's fast test-mode; benches are covered by
      # the Benchmarks workflow + bench-compile check instead.
      # --no-fail-fast: report every failing test in one run instead of
      # stopping at the first (one platform-specific failure used to hide
      # the rest of the matrix).
      - run: cargo nextest run --lib --bins --tests --profile ci --no-fail-fast

  bench-compile:
    timeout-minutes: 25
    name: Benchmark Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  proptest:
    timeout-minutes: 15
    name: Property-Based Tests
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "4096"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets proptest
      - run: cargo test -p wm-core --test taxonomy
      - run: cargo test -p wm-tools --lib nlu
      - run: cargo test -p wm-governance --lib dharma_gate
      - run: cargo test -p wm-dispatch --lib rate_limiter
      - run: cargo test -p wm-core --lib effects

  zero-egress:
    timeout-minutes: 20
    name: Zero-Egress Proof (Q37)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin wm
      - name: Proof run (namespace with lo DOWN, create + recall)
        run: scripts/zero_egress_test.sh | tee zero-egress-proof.txt
        env:
          WM: ${{ github.workspace }}/target/release/wm
      - name: Negative control (the harness must be able to fail)
        run: |
          if scripts/zero_egress_test.sh; then
            echo "NEGATIVE CONTROL FAILED: the harness passed with a broken binary — it cannot fail, so it proves nothing"
            exit 1
          fi
          echo "negative control OK: harness fails loudly when WM is /bin/false"
        env:
          WM: /bin/false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-egress-proof
          path: zero-egress-proof.txt
          if-no-files-found: error

  audit:
    timeout-minutes: 10
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
