name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    timeout-minutes: 10
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    timeout-minutes: 15
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  truth:
    timeout-minutes: 10
    name: Version Truth Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/version_truth.py --check

  python-tests:
    timeout-minutes: 15
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run python unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  test-linux:
    timeout-minutes: 35
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Cache fastembed model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .fastembed_cache
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-onnx-q-v1
      - name: Fetch dependencies (locked)
        run: cargo fetch --locked
      - name: Closure static scans
        # docs/CLOSURE_TESTS.md §1.1-B/C + §2.1 (dependency rule, mutation
        # surface isolation) and CHARTER Article 4 (spawns only in the
        # physical-I/O transports). The scan's `cargo tree` runs --offline,
        # so it depends on the locked fetch above. The script is tracked;
        # a missing file is a hard failure, not a skipped gate.
        run: |
          if [ ! -f scripts/check_closures.sh ]; then
            echo "::error::scripts/check_closures.sh missing from this tree; the closure gate is mandatory"
            exit 1
          fi
          bash scripts/check_closures.sh
      - name: Warm fastembed cache
        run: cargo run -p wm-gen3-core --example warm_embed_cache
      - name: Run workspace tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee tests-output.txt
      - name: Run gate batteries (reference-models)
        # Activates the Gate 9A adversary_contract and Gate 9D reality
        # batteries, which never compile under the default feature set.
        # `operator` is unified in via wm-gen3-harness's dependency on
        # wm-gen3-core; projection::tests / ops::gated_tests are covered by
        # the default workspace run and are skipped here.
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --workspace --features wm-gen3-core/reference-models \
            -- --skip projection::tests --skip ops::gated_tests 2>&1 | tee -a tests-output.txt
      - name: Summarize test facts
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          passed = failed = ignored = 0
          if os.path.exists("tests-output.txt"):
              with open("tests-output.txt", encoding="utf-8", errors="replace") as fh:
                  for line in fh:
                      match = re.match(
                          r"test result: \w+\. (\d+) passed; (\d+) failed; (\d+) ignored;",
                          line,
                      )
                      if match:
                          p, f, i = (int(value) for value in match.groups())
                          passed += p
                          failed += f
                          ignored += i
          facts = {
              "passed": passed,
              "ignored": ignored,
              "failed": failed,
              "source": f"ci-{os.environ.get('GITHUB_RUN_ID', 'local')}",
          }
          with open("tests.json", "w", encoding="utf-8") as fh:
              json.dump(facts, fh, indent=2)
              fh.write("\n")
          print(facts)
          PY
      - name: Upload test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-summary
          path: tests.json
          if-no-files-found: warn

  test-macos:
    timeout-minutes: 30
    name: Tests (macOS, advisory)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Cache fastembed model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .fastembed_cache
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-onnx-q-v1
      - name: Warm fastembed cache
        run: cargo run -p wm-gen3-core --example warm_embed_cache
      - name: Run workspace tests
        run: cargo test --workspace --no-fail-fast

  build-release:
    timeout-minutes: 20
    name: Build Release Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo build --release --bin wm
      - name: Verify binary execution
        run: target/release/wm --version
      - name: Selftest smoke (informational)
        # Host-health checks depend on the runner (cgroups, ports, disk);
        # record the JSON but never fail the release build on them.
        continue-on-error: true
        run: target/release/wm selftest --json

  npm:
    timeout-minutes: 10
    name: npm Launcher Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: npm tests
        working-directory: npm/whitemagic-mcp
        run: node --test
