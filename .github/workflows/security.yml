name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers every commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  public-surface:
    name: public-surface guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/public_surface_check.sh

  # Ported concept from the v26 archives (og_whitemagic
  # .github/workflows/security-ci.yml: STRATA checkers + dependency audits).
  # Rust-side equivalent: clippy (lint gate in ci.yml) + this hard cargo-deny
  # gate. Policy lives in the root deny.toml; every ignore there carries its
  # rationale and is re-reviewed when the advisory DB moves.
  cargo-deny:
    name: dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
