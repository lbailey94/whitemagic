name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the scan covers every commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action reads the config from this env var (it declares no
          # `config-path` input; passing one only warns). The scheduled
          # full-history scan found fixture-shaped strings in test files
          # (credential-detector vectors, receipt JWT samples, the RFC 5869
          # vector); .gitleaks.toml allowlists exactly those.
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action's bundled default (8.24.3) predates the `[[allowlists]]`
          # config form, so it ignored the allowlist and re-reported all 33
          # historical fixtures (2026-10-05). Pin the version the config was
          # written for; local 8.30.1 scans the same tree clean.
          GITLEAKS_VERSION: "8.30.1"
          # Keep the PR scan read-only; finding comments require extra writes.
          GITLEAKS_ENABLE_COMMENTS: "false"

  public-surface:
    name: public-surface guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/public_surface_check.sh

  # Ported concept from the v26 archives (og_whitemagic
  # .github/workflows/security-ci.yml: STRATA checkers + dependency audits).
  # Rust-side equivalent: clippy (lint gate in ci.yml) + this hard cargo-deny
  # gate. Policy lives in the root deny.toml; every ignore there carries its
  # rationale and is re-reviewed when the advisory DB moves.
  cargo-deny:
    name: dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
