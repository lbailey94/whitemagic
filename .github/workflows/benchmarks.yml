name: Benchmarks

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  benchmark:
    name: PEB-0 release evidence
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Qualify PEB-10 timing (repeated release-mode samples)
        run: python3 benchmarks/qualify_peb10_timing.py

      - name: Upload PEB-10 timing samples
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: peb10-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/peb10-timing.json
          if-no-files-found: warn

      - name: Run existing PEB-0 and PEB-0.1 release tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          {
            echo "kind=release-mode-library-tests"
            echo "revision=$(git rev-parse HEAD)"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            rustc -Vv
            cargo -V
          } 2>&1 | tee benchmark_results.txt
          run_one_peb_test() {
            local test_filter="$1"
            local output_file="$2"
            cargo test -p wm-gen3-core --features operator --release --lib "$test_filter" -- --exact --nocapture --color never 2>&1 | tee "$output_file"
            local running_count
            running_count="$(awk '$0 == "running 1 test" { count++ } END { print count + 0 }' "$output_file")"
            local passing_test_count
            passing_test_count="$(awk -v filter="$test_filter" 'index($0, "test " filter) == 1 && $0 ~ /[.][.][.] ok$/ { count++ } END { print count + 0 }' "$output_file")"
            local passing_summary_count
            passing_summary_count="$(awk '$0 ~ /^test result: ok[.] 1 passed; 0 failed;/ { count++ } END { print count + 0 }' "$output_file")"
            if [[ "$running_count" != "1" || "$passing_test_count" != "1" || "$passing_summary_count" != "1" ]]; then
              echo "expected exactly one passing test for $test_filter; found running=$running_count, named_passes=$passing_test_count, passing_summaries=$passing_summary_count" >&2
              return 1
            fi
            return 0
          }
          run_one_peb_test pulse::tests::test_peb0_minimality_benchmark_execution benchmark-results/peb0.log
          run_one_peb_test pulse::tests::test_peb0_1_intelligent_merger_benchmark_execution benchmark-results/peb0.1.log
          cat benchmark-results/peb0.log benchmark-results/peb0.1.log >> benchmark_results.txt
          cp benchmark_results.txt benchmark-results/benchmark_results.txt

      - name: Upload release-mode benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-results
          path: |
            benchmark_results.txt
            benchmark-results/
          if-no-files-found: warn

  publish-benchmark-evidence:
    name: Attach release benchmark evidence
    needs: [benchmark]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download benchmark evidence from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-results
          path: benchmark-release-artifacts

      - name: Attach benchmark evidence to release tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: benchmark-release-artifacts/benchmark_results.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bench-regression-check:
    name: PEB-0 PR/base raw comparison (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run PR head PEB-0 tests in release mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-comparison
          expected_revision="${{ github.event.pull_request.head.sha }}"
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$expected_revision"
          {
            echo "kind=release-mode-library-tests"
            echo "expected_revision=$expected_revision"
            echo "actual_revision=$actual_revision"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            rustc -Vv
            cargo -V
          } 2>&1 | tee benchmark-comparison/pr-metadata.txt
          run_one_peb_test() {
            local test_filter="$1"
            local output_file="$2"
            cargo test -p wm-gen3-core --features operator --release --lib "$test_filter" -- --exact --nocapture --color never 2>&1 | tee "$output_file"
            local running_count
            running_count="$(awk '$0 == "running 1 test" { count++ } END { print count + 0 }' "$output_file")"
            local passing_test_count
            passing_test_count="$(awk -v filter="$test_filter" 'index($0, "test " filter) == 1 && $0 ~ /[.][.][.] ok$/ { count++ } END { print count + 0 }' "$output_file")"
            local passing_summary_count
            passing_summary_count="$(awk '$0 ~ /^test result: ok[.] 1 passed; 0 failed;/ { count++ } END { print count + 0 }' "$output_file")"
            if [[ "$running_count" != "1" || "$passing_test_count" != "1" || "$passing_summary_count" != "1" ]]; then
              echo "expected exactly one passing test for $test_filter; found running=$running_count, named_passes=$passing_test_count, passing_summaries=$passing_summary_count" >&2
              return 1
            fi
            return 0
          }
          run_one_peb_test pulse::tests::test_peb0_minimality_benchmark_execution benchmark-comparison/pr-peb0.log
          run_one_peb_test pulse::tests::test_peb0_1_intelligent_merger_benchmark_execution benchmark-comparison/pr-peb0.1.log

      - name: Checkout exact PR base commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Run exact base PEB-0 tests in release mode
        working-directory: base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../benchmark-comparison
          expected_revision="${{ github.event.pull_request.base.sha }}"
          actual_revision="$(git rev-parse HEAD)"
          test "$actual_revision" = "$expected_revision"
          {
            echo "kind=release-mode-library-tests"
            echo "expected_revision=$expected_revision"
            echo "actual_revision=$actual_revision"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            rustc -Vv
            cargo -V
          } 2>&1 | tee ../benchmark-comparison/base-metadata.txt
          run_one_peb_test() {
            local test_filter="$1"
            local output_file="$2"
            cargo test -p wm-gen3-core --features operator --release --lib "$test_filter" -- --exact --nocapture --color never 2>&1 | tee "$output_file"
            local running_count
            running_count="$(awk '$0 == "running 1 test" { count++ } END { print count + 0 }' "$output_file")"
            local passing_test_count
            passing_test_count="$(awk -v filter="$test_filter" 'index($0, "test " filter) == 1 && $0 ~ /[.][.][.] ok$/ { count++ } END { print count + 0 }' "$output_file")"
            local passing_summary_count
            passing_summary_count="$(awk '$0 ~ /^test result: ok[.] 1 passed; 0 failed;/ { count++ } END { print count + 0 }' "$output_file")"
            if [[ "$running_count" != "1" || "$passing_test_count" != "1" || "$passing_summary_count" != "1" ]]; then
              echo "expected exactly one passing test for $test_filter; found running=$running_count, named_passes=$passing_test_count, passing_summaries=$passing_summary_count" >&2
              return 1
            fi
            return 0
          }
          run_one_peb_test pulse::tests::test_peb0_minimality_benchmark_execution ../benchmark-comparison/base-peb0.log
          run_one_peb_test pulse::tests::test_peb0_1_intelligent_merger_benchmark_execution ../benchmark-comparison/base-peb0.1.log

      - name: Summarize raw PR/base outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# PEB-0 release-mode raw comparison (advisory)"
            echo
            echo "This job runs the existing PEB-0 and PEB-0.1 library tests once on the exact PR head and exact base SHA. It reports raw outputs only: shared-runner measurements are noisy, and this is not Criterion regression proof or a percentage gate."
            echo
            for file in benchmark-comparison/*; do
              if [[ -f "$file" ]]; then
                echo "## $file"
                echo '```text'
                cat "$file"
                echo '```'
              fi
            done
          } | tee comparison.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR/base raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-comparison/
            comparison.txt
          if-no-files-found: warn
