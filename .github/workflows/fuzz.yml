name: Fuzz Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: Fuzz Smoke Tests (30s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Corpus regression (replay committed seeds, 1k runs each)
        run: |
          for target in frame_read envelope_parse; do
            echo "--- $target ---"
            cargo +nightly fuzz run --fuzz-dir . "$target" -- -runs=1000
          done
        working-directory: fuzz

      - name: Smoke-fuzz all targets (30s each)
        run: |
          for target in frame_read envelope_parse; do
            echo "--- $target ---"
            cargo +nightly fuzz run --fuzz-dir . "$target" -- -max_total_time=30
          done
        working-directory: fuzz
