name: Release health

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v (default: latest GitHub release)'
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-health
  cancel-in-progress: false

jobs:
  reconcile:
    name: Probe, retry laggards, certify installs
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            # A prerelease never appears in releases/latest, so the tag that
            # triggered the Release run is the only honest source here.
            V="${{ github.event.workflow_run.head_branch }}"
            V="${V#v}"
          fi
          if [ -z "$V" ]; then
            # Newest release, prereleases included (the alpha channel is the
            # normal release here; releases/latest excludes prereleases and
            # would leave the monitor probing a stale stable). Newest first
            # by created_at. A gh failure must never leak its JSON error body
            # into later steps — that exact bug fed `{"message":"Not Found"}`
            # into `git fetch` and exited 127 (2026-10-05).
            V="$(gh api "repos/${{ github.repository }}/releases?per_page=1" \
              --jq '.[0].tag_name // empty' 2>/dev/null || true)"
            V="${V#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::could not resolve a release version (got: '${V}')"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "probing v$V"

      - name: Check out the release tree
        # The probe (and every retry) must run against the tag's own tree:
        # the crate list, npm package, and Dockerfile are version-specific.
        # Probing an old release with main's scripts was the 2026-10-04
        # false-LAGGING class (main's gen3 crate list vs a v9 release).
        run: |
          set -eu
          V="${{ steps.version.outputs.version }}"
          git fetch --depth=1 origin "refs/tags/v${V}"
          git checkout --detach FETCH_HEAD
          TREE_V="$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          [ "$TREE_V" = "$V" ] || { echo "::error::tag v${V} tree declares workspace version ${TREE_V}"; exit 1; }
          echo "probing from tag v${V} tree ($(git log -1 --format='%h %s'))"

      - name: Probe registries (initial)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_health.py --version "${{ steps.version.outputs.version }}" \
            --json release-health.json

      - name: Show laggards
        run: |
          if jq -e '.status == "healthy"' release-health.json >/dev/null; then
            echo "all surfaces live after fan-out"
          else
            echo "laggards:"; jq -c '.registries | to_entries[] | select(.value.status != "live")' release-health.json
          fi

      # ── Retries: idempotent, per surface, only when that surface lags ──

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Retry npm (if lagging)
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ "$(jq -r '.registries.npm.status' release-health.json)" = "live" ] && { echo "npm live"; exit 0; }
          cd npm/whitemagic-mcp
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() }}

      - name: Retry crates.io (if lagging)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TREE_V="$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          if [ "$TREE_V" != "$VERSION" ]; then
            echo "::warning::tree is at ${TREE_V} but probing ${VERSION}; refusing to publish mis-versioned crates"
            exit 0
          fi
          missing="$(jq -r '.registries["crates.io"].missing[]? // empty' release-health.json)"
          if [ "$(jq -r '.registries["crates.io"].status' release-health.json)" = "live" ] || [ -z "$missing" ]; then
            echo "crates.io live"; exit 0
          fi
          for c in $missing; do
            echo "retrying $c"
            cargo publish -p "$c" || echo "retry failed for $c (re-probe decides)"
          done

      - name: Retry Docker Hub (if lagging)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$(jq -r '.registries.docker.status' release-health.json)" = "live" ]; then
            echo "docker live"; exit 0
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then echo "DOCKERHUB_TOKEN not set - cannot retry"; exit 0; fi
          VERSION="${{ steps.version.outputs.version }}"; MAJOR="${VERSION%%.*}"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          # Prereleases tag only the exact version; latest/major stay stable.
          if [[ "$VERSION" == *-* ]]; then
            TAGS=(-t "lbailey94/whitemagic:${VERSION}")
          else
            TAGS=(-t "lbailey94/whitemagic:${VERSION}" -t "lbailey94/whitemagic:${MAJOR}" -t lbailey94/whitemagic:latest)
          fi
          docker build --build-arg "WM_VERSION=v${VERSION}" "${TAGS[@]}" .
          for tag in "${TAGS[@]}"; do
            [ "$tag" = "-t" ] && continue
            docker push "$tag"
          done

      - name: Retry MCP registry (if lagging)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ "$(jq -r '.registries["mcp-registry"].status' release-health.json)" = "live" ]; then
            echo "mcp-registry live"; exit 0
          fi
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz -C /tmp mcp-publisher
          cd npm/whitemagic-mcp
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish server.json || echo "publish attempt failed (re-probe decides)"

      - name: Re-probe (final record)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/release_health.py --version "${{ steps.version.outputs.version }}" \
            --json release-health.json
          echo "re-probe exit=$? (1 = laggards remain; the gate below decides)"

      # ── Install certification: the published artifacts must run ──

      - name: Certify npm install (download funnel + selftest)
        continue-on-error: true
        run: |
          [ "$(jq -r '.registries.npm.status' release-health.json)" = "live" ] || exit 0
          npm install -g "whitemagic-mcp@${{ steps.version.outputs.version }}"
          whitemagic-mcp selftest --json > npm-selftest.json

      - name: Certify Docker image (run + selftest)
        continue-on-error: true
        run: |
          [ "$(jq -r '.registries.docker.status' release-health.json)" = "live" ] || exit 0
          docker run --rm "lbailey94/whitemagic:${{ steps.version.outputs.version }}" selftest --json > docker-selftest.json

      - name: Merge certifications into the record
        run: |
          python3 - <<'PY'
          import json, pathlib
          rec = json.loads(pathlib.Path("release-health.json").read_text())
          certs = {}
          for name in ("npm", "docker"):
              p = pathlib.Path(f"{name}-selftest.json")
              data = None
              if p.exists():
                  try:
                      data = json.loads(p.read_text())
                  except ValueError:
                      data = None
              if data is not None:
                  # The binary's selftest JSON reports {"status":"ok",
                  # "invariants":"pass"}; accept the legacy `passed` boolean
                  # too. (Checking only `passed` marked two good installs as
                  # fail on 2026-10-05 — alpha.3's record showed status ok,
                  # invariants pass, certification fail.)
                  passed = bool(data.get("passed")) or data.get("status") == "ok"
                  certs[name] = {"status": "pass" if passed else "fail", "selftest": data}
              elif p.exists():
                  # The certify step ran but produced no JSON (it failed and
                  # continue-on-error swallowed it). Record the fail honestly;
                  # an empty file must not crash this merge step.
                  certs[name] = {
                      "status": "fail",
                      "selftest": None,
                      "note": "certification produced no JSON (step failed; see job log)",
                  }
              else:
                  certs[name] = {"status": "not-run"}
          rec["install_certification"] = certs
          pathlib.Path("release-health.json").write_text(
              json.dumps(rec, indent=2, sort_keys=True) + "\n")
          PY
          jq -c '.install_certification | map_values(.status)' release-health.json

      - name: Upload the record to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release-health.json "release-health-$(date -u +%Y%m%d).json"
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            gh release upload "v${{ steps.version.outputs.version }}" release-health.json --clobber
          else
            echo "release tag not found; keeping the record as a workflow artifact"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-health
          path: release-health*.json

      - name: Gate — every surface live and every install certified
        run: |
          jq -e '.status == "healthy"' release-health.json >/dev/null \
            || { echo "registries still lagging:"; jq -c '.registries | to_entries[] | select(.value.status != "live") | {key, status: .value.status}' release-health.json; exit 1; }
          jq -e '.install_certification.npm.status == "pass"
                 and .install_certification.docker.status == "pass"' release-health.json >/dev/null \
            || { echo "install certification not passing:"; jq -c '.install_certification | map_values(.status)' release-health.json; exit 1; }
          echo "release v${{ steps.version.outputs.version }} is healthy and certified"
