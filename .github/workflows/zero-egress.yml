name: zero-egress

# The zero-egress proof as a gate, not a claim.
#
# scripts/zero_egress_test.sh runs a full-profile Gen3 create -> exact-ID
# recall journey inside a network namespace whose only interface is a DOWN
# loopback, with a separate route-blocked egress control.
#
# This workflow runs it on every mainline push, every pull request, every
# release tag (v*), and weekly on a schedule, and publishes the log as an
# artifact so a reviewer can read the proof instead of taking our word for it.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "zero-egress-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proof:
    name: Zero-Egress Proof (netns, lo DOWN)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: zero-egress

      - name: Build release binary
        run: cargo build --release --locked -p wm-gen3-harness --bin wm

      - name: Report binary identity
        run: |
          set -euo pipefail
          echo "source_revision=$GITHUB_SHA" | tee binary-version.txt
          target/release/wm --version | tee -a binary-version.txt
          binary_sha="$(sha256sum target/release/wm | awk '{print $1}')"
          echo "binary_sha256=$binary_sha" | tee -a binary-version.txt
          echo "WM_EXPECTED_SHA256=$binary_sha" >> "$GITHUB_ENV"

      - name: Test zero-egress RPC harness
        run: python3 -m unittest discover -s scripts/tests -p 'test_zero_egress_rpc.py' -v

      # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1, which
      # turns `unshare -rn` into EPERM. The proof needs the namespace, so lift
      # the restriction on the ephemeral runner only (never on a real host) and
      # fail loudly if the namespace still cannot be created.
      - name: Ensure unprivileged network namespaces are available
        run: |
          set -euo pipefail
          if ! unshare -rn true 2>/dev/null; then
            echo "unprivileged userns blocked; lifting AppArmor restriction on this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rn true
          echo "userns: available"

      - name: Run the proof
        env:
          WM_BINARY: ${{ github.workspace }}/target/release/wm
          WM_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${WM_EXPECTED_SHA256:?build identity step must supply expected binary SHA-256}"
          set -o pipefail
          bash scripts/zero_egress_test.sh 2>&1 | tee zero-egress-proof.log

      - name: Publish summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Zero-egress proof"
            echo
            echo "Method: \`scripts/zero_egress_test.sh\` — the product loop runs inside"
            echo "\`unshare --user --map-root-user --net\` with a single interface (\`lo\`, DOWN), asserts the"
            echo "interface set and empty route tables, confirms an external TCP"
            echo "negative control is route-blocked, then asserts the full-profile"
            echo "serve → \`memory.create\` → exact-ID \`memory.search\` loop works."
            echo
            echo "Scope: this demonstrates operation with networking disabled. It is"
            echo "not a proof that no code path could ever attempt egress on a host"
            echo "with a live interface."
            echo
            echo '```'
            cat zero-egress-proof.log 2>/dev/null || echo "(no log produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-egress-proof
          path: |
            zero-egress-proof.log
            binary-version.txt
          retention-days: 90
          if-no-files-found: warn
