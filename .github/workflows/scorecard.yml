name: scorecard

# OpenSSF Scorecard — machine-checked answers to the questions a security
# funder asks first (branch protection, pinned dependencies, token
# permissions, dangerous workflows, signed releases).
#
# Default-branch runs request publication to the public OpenSSF API.
# Confirm an accepted result before citing a published score:
#   https://api.securityscorecards.dev/projects/github.com/lbailey94/whitemagic

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6" # Saturdays 01:30 UTC
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # publish results to the OpenSSF API
      contents: read
      actions: read

    # Publication accepts only approved action steps in this job; shell
    # summary steps cause the results service to reject the workflow.
    # https://github.com/ossf/scorecard-action#workflow-restrictions
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
