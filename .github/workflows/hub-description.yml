name: Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: PATCH full_description from the runbook block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the README block from docs/DOCKER_HUB_RUNBOOK.md
        run: |
          python3 - <<'PY' > /tmp/hub-description.md
          from pathlib import Path
          lines = Path('docs/DOCKER_HUB_RUNBOOK.md').read_text().splitlines()
          start = next(i for i, l in enumerate(lines) if l.startswith('> **WhiteMagic**'))
          end = next(i for i, l in enumerate(lines) if l.startswith('> Store your data'))
          block = []
          for l in lines[start:end + 1]:
              if l.startswith('> '):
                  block.append(l[2:])
              elif l == '>':
                  block.append('')
              else:
                  block.append(l)
          out = []
          for l in block:
              if out and l.startswith('  ') and out[-1] != '':
                  out[-1] = out[-1] + ' ' + l.strip()
              elif out and out[-1] != '' and not out[-1].startswith('- ') \
                      and not l.startswith('- ') and l != '':
                  out[-1] = out[-1] + ' ' + l
              else:
                  out.append(l)
          print('\n'.join(out).rstrip())
          PY
          grep -q 'Current release: v' /tmp/hub-description.md \
            || { echo "runbook block carries no Current release line"; exit 1; }
          wc -c /tmp/hub-description.md

      - name: Date the Current release line from the signed manifest
        run: |
          LINE=$(grep -m1 'Current release: v' /tmp/hub-description.md)
          VERSION=$(printf '%s' "$LINE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')
          [ -n "$VERSION" ] || { echo "cannot parse a version from: $LINE"; exit 1; }
          curl -fsSL "https://github.com/lbailey94/whitemagic/releases/download/v${VERSION}/release-manifest.json" \
            -o /tmp/release-manifest.json
          MV=$(jq -r '.version // empty' /tmp/release-manifest.json)
          PUB=$(jq -r '.published // empty' /tmp/release-manifest.json)
          DATE=${PUB%%T*}
          [ "$MV" = "$VERSION" ] || { echo "manifest version '$MV' != description version '$VERSION'"; exit 1; }
          [ -n "$DATE" ] || { echo "manifest for v$VERSION carries no published timestamp"; exit 1; }
          python3 - "$VERSION" "$DATE" <<'PY'
          import sys
          version, date = sys.argv[1], sys.argv[2]
          path = '/tmp/hub-description.md'
          want = (f"- Current release: v{version} ({date}) — "
                  f"https://github.com/lbailey94/whitemagic/releases/tag/v{version}")
          lines = open(path).read().splitlines()
          for i, line in enumerate(lines):
              if line.startswith('- Current release: v'):
                  lines[i] = want
                  break
          else:
              raise SystemExit('no Current release line to rewrite')
          open(path, 'w').write('\n'.join(lines) + '\n')
          print('rewrote:', want)
          PY

      - name: Log in and PATCH the description
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$HUB_TOKEN" ] || { echo "DOCKERHUB_TOKEN not set"; exit 1; }
          JWT=$(curl -fsS -H "Content-Type: application/json" \
            -d "$(jq -n --arg u "$HUB_USER" --arg p "$HUB_TOKEN" '{username:$u,password:$p}')" \
            https://hub.docker.com/v2/users/login | jq -r '.token // empty')
          [ -n "$JWT" ] || { echo "Hub login failed"; exit 1; }
          echo "::add-mask::$JWT"
          jq -n --rawfile d /tmp/hub-description.md '{full_description:$d}' > /tmp/hub-patch.json
          CODE=$(curl -s -o /tmp/hub-response.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            --data @/tmp/hub-patch.json \
            https://hub.docker.com/v2/repositories/lbailey94/whitemagic/)
          echo "PATCH http $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Hub API refused the description update (needs a PAT scoped read/write/delete):"
            head -c 300 /tmp/hub-response.json
            exit 1
          fi

      - name: Verify the public description
        run: |
          WANT=$(grep -m1 '^- Current release: v' /tmp/hub-description.md)
          GOT=$(curl -fsS https://hub.docker.com/v2/repositories/lbailey94/whitemagic/ \
            | jq -r '.full_description' \
            | grep -m1 '^- Current release: v' || true)
          echo "want: $WANT"; echo "got:  $GOT"
          [ "$GOT" = "$WANT" ]
