# cargo-deny configuration — dependency governance for whitemagic
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Scope: check advisories for workspace + transitive deps.
# Unmaintained and unsound crates are reported; vulnerabilities are denied
# by cargo-deny's default (severity threshold = low is the 0.20 default).
unmaintained = "workspace"
unsound = "all"
ignore = [
    # RUSTSEC-2022-0001: lmdb 0.8 unmaintained — accepted (core store,
    # all LMDB forks equally unmaintained, data compatibility matters).
    "RUSTSEC-2022-0001",
    # RUSTSEC-2024-0436: paste unmaintained — accepted (transitive via
    # optional lance-bitpacking, not in the default build).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0253: lru LruCache::pop() not panic-safe — accepted
    # (transitive via tantivy query cache; keys are plain strings whose
    # Drop cannot panic, and no patched lru release exists yet).
    "RUSTSEC-2026-0253",
]

[bans]
multiple-versions = "warn"
# Workspace-internal deps (wm-* = { workspace = true }) are versioned by the
# workspace root, so they are intentionally not wildcards to be denied.
wildcards = "allow"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
