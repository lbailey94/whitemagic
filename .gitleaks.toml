# Gitleaks configuration — allowlist for WhiteMagic's own credential-detector
# test fixtures. crates/wm-memory/src/credentials.rs and
# scripts/mine_opencode_corpus.py contain placeholder shapes (ghp_0123…,
# AKIAIOSFODNN7EXAMPLE, RFC 7519 example JWT, correct-horse-battery-staple)
# used to TEST the ingest-path credential-shape detector
# (wm_memory::credential_shaped_content). The Slack token fixture is
# assembled at runtime so the raw shape never appears in source. Nothing
# here is a real credential; gitleaks findings scoped to these two paths
# are false positives by construction.
#
# 2026-09-17: crates/wm-core/src/kdf.rs carries the PUBLISHED RFC 5869
# HKDF test vector (hex_key = 001122…ff — zero-entropy, straight from the
# RFC) as the KDF conformance proof; the generic-api-key rule flags it.
# Scanned finding allowlisted by exact value (not by path — kdf.rs stays
# under the scanner for real findings).
#
# 2026-09-18: the Q39 at-rest keyring meta records its key source as the
# mode label "argon2id_passphrase"; the generic-api-key rule reads the
# `key_source:` field name plus that value as an assignment. Exact-value
# allowlist again — crates/wm-memory/src/at_rest.rs stays scanned.
[extend]
useDefault = true

[allowlist]
description = "credential-detector test fixtures (placeholder shapes only) + RFC 5869 HKDF vector + at-rest mode label"
paths = [
    '''(^|/)crates/wm-memory/src/credentials\.rs$''',
    '''(^|/)scripts/mine_opencode_corpus\.py$''',
    '''(^|/)crates/wm-governance/src/decoy_shell\.rs$''',
    '''(^|/)crates/wm-governance/src/canary_tokens\.rs$''',
]
regexes = [
    '''00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff''',
    '''argon2id_passphrase''',
]
